name: Long-cycle Fourier real axis
on:
  pull_request:
    branches: [research]
    paths:
      - '.github/workflows/long-cycle-fourier-real-axis.yml'
      - 'topics/long-cycle-excedances/lean/fourier-stable/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean 4.33.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o pinned.tar.zst https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  pinned.tar.zst' | sha256sum -c
          tar --zstd -xf pinned.tar.zst
          rm pinned.tar.zst
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Compile and replay the real-axis bridge
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          python3 -Bu topics/long-cycle-excedances/lean/fourier-stable/check-real-axis.py "$RUNNER_TEMP/fourier-real-axis" 2>&1 | tee "$RUNNER_TEMP/fourier-real-axis.log"
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fourier-real-axis-report
          path: ${{ runner.temp }}/fourier-real-axis.log
          retention-days: 30
