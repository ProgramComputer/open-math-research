name: Rebuild Bowen Zuo's cutoff-seven proof
on:
  pull_request:
    branches: [research]
    paths:
      - '.github/workflows/external-cutoff-seven.yml'
      - 'topics/long-cycle-excedances/external-verification/cutoff-seven/*.lean'
      - 'topics/long-cycle-excedances/external-verification/cutoff-seven/*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" = github-hosted ]] && (( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') < 45*1024*1024 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
          if [[ "$RUNNER_ENVIRONMENT" = github-hosted ]] && (( $(free -m | awk '/^Swap:/ {print $2}') < 8192 )); then
            sudo fallocate -l 8G "$RUNNER_TEMP/proof.swap"
            sudo chmod 600 "$RUNNER_TEMP/proof.swap"
            sudo mkswap "$RUNNER_TEMP/proof.swap"
            sudo swapon "$RUNNER_TEMP/proof.swap"
          fi
          mkdir -p "$RUNNER_TEMP/verification"
          free -h
          df -h "$RUNNER_TEMP"
      - name: Install frozen Lean 4.33.1 for excedances
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o pinned.tar.zst https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  pinned.tar.zst' | sha256sum -c
          tar --zstd -xf pinned.tar.zst
          rm pinned.tar.zst
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Rebuild, audit declarations and replay the supplying proof
        shell: bash
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          python3 -Bu topics/long-cycle-excedances/external-verification/cutoff-seven/check.py "$RUNNER_TEMP/cutoff-seven" --checkpoint "$RUNNER_TEMP/supplier-checkpoint.tar.zst" 2>&1 | tee "$RUNNER_TEMP/verification/lean.log"
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutoff-seven-independent
          path: ${{ runner.temp }}/verification
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve supplier checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutoff-seven-supplier-checkpoint
          path: ${{ runner.temp }}/supplier-checkpoint.tar.zst
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
