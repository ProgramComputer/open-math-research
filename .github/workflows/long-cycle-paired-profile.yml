name: Long-cycle paired profile
on:
  pull_request:
    branches: [research]
    paths:
      - '.github/workflows/long-cycle-paired-profile.yml'
      - 'topics/long-cycle-excedances/lean/paired-profile/**'
      - 'topics/long-cycle-excedances/lean/sine-comparison/Principal*.lean'

concurrency:
  group: paired-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean 4.33.1 and recover the audited imports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [[ "$RUNNER_ENVIRONMENT" = github-hosted ]] && (( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') < 45*1024*1024 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
          curl -fLsS --retry 3 -o pinned.tar.zst https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  pinned.tar.zst' | sha256sum -c
          tar --zstd -xf pinned.tar.zst
          rm pinned.tar.zst
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
          gh run download 45917288503 --repo "$GITHUB_REPOSITORY" --name quotient-import-objects --dir "$RUNNER_TEMP" || true
      - name: Compile and replay paired profile
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          args=("$RUNNER_TEMP/common-pin")
          if [[ -f "$RUNNER_TEMP/quotient-import-objects.tar.zst" ]]; then
            args+=("$RUNNER_TEMP/quotient-import-objects.tar.zst")
          fi
          python3 -Bu topics/long-cycle-excedances/lean/paired-profile/check.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/paired-profile.log"
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-profile-report
          path: ${{ runner.temp }}/paired-profile.log
          retention-days: 30
