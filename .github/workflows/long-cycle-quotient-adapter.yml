name: Long-cycle quotient adapter
on:
  pull_request:
    branches: [research]
    paths:
      - '.github/workflows/long-cycle-quotient-adapter.yml'
      - 'topics/long-cycle-excedances/lean/pinned-quotient/**'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve space for the pinned cache
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" = github-hosted ]] && (( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') < 45*1024*1024 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          fi
      - name: Install pinned Lean 4.33.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o pinned.tar.zst https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  pinned.tar.zst' | sha256sum -c
          tar --zstd -xf pinned.tar.zst
          rm pinned.tar.zst
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Reuse retained pinned imports if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cached="$RUNNER_TEMP/quotient-cache/quotient-import-objects.tar.zst"
          if gh run download 45917288503 --repo "$GITHUB_REPOSITORY" --name quotient-import-objects --dir "$(dirname "$cached")"; then
            echo "000f5b74d9fe3aa351b19b0db90b4ab23b1e6329cbe6f6129b355f68b285cc05  $cached" | sha256sum -c
            echo "QUOTIENT_IMPORT_OBJECTS=$cached" >> "$GITHUB_ENV"
          fi
      - name: Check general coefficient bridge and execute fixture comparison
        env:
          LEAN_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          python3 -Bu topics/long-cycle-excedances/lean/pinned-quotient/check.py "$RUNNER_TEMP/proof" 2>&1 | tee "$RUNNER_TEMP/quotient-adapter.log"
      - name: Diagnose adapter with retained imports
        if: failure()
        working-directory: ${{ runner.temp }}/proof/verified-build
        run: lake env lean RepositoryQuotientAdapter.lean 2>&1 | tee "$RUNNER_TEMP/quotient-diagnostic.log"
      - name: Preserve frozen project objects on failure
        if: failure()
        working-directory: ${{ runner.temp }}/proof/verified-build
        run: |
          set -euo pipefail
          tar --zstd -cf "$RUNNER_TEMP/quotient-import-objects.tar.zst" .lake/build/lib/lean
      - name: Upload retained import objects
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quotient-import-objects
          path: ${{ runner.temp }}/quotient-import-objects.tar.zst
          retention-days: 7
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quotient-adapter
          path: |
            ${{ runner.temp }}/quotient-adapter.log
            ${{ runner.temp }}/quotient-diagnostic.log
          retention-days: 30
